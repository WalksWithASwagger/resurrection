# Runs once this folder is the root of its own repository. Inside a parent
# monorepo, nested workflows are inert and the parent verifies this package.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Current 22.x, not the 22.18.0 floor: 22.18.0 mis-decodes windows-1252
        # bytes 0x80-0x9F (see README, Requirements).
        node: ['22', '24']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: python3 -m json.tool agentic/contract.json > /dev/null
      - run: python3 -m json.tool benchmarks/pilots.json > /dev/null
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run acquire:fixture
      - run: pnpm run reclassify:fixture
